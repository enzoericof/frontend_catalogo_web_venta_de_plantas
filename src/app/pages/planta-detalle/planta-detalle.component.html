<!-- ================= HEADER ================= -->
<header class="header">
  <div class="container header-inner">
    <a class="logo" routerLink="/">VIVERO</a>
  </div>
</header>

<!-- ================= PAGE ================= -->
<section class="detalle-page">

  <!-- ===== BREADCRUMB ===== -->
  <nav class="breadcrumb" *ngIf="planta">
    <a routerLink="/">Catálogo</a>
    <span>/</span>
    <strong>{{ planta.nombre }}</strong>
  </nav>

  <!-- ===== CONTENIDO ===== -->
  <div class="detalle-grid" *ngIf="!cargando && planta">

    <!-- ===== GALERÍA ===== -->
    <div class="galeria">

      <div class="imagen-wrap">
        <button
          class="nav-arrow left"
          *ngIf="planta.imagenes.length > 1"
          (click)="imagenAnterior()">
          ‹
        </button>

        <img
          class="imagen-principal"
          [src]="imagenActiva"
          [alt]="planta.nombre" />

        <button
          class="nav-arrow right"
          *ngIf="planta.imagenes.length > 1"
          (click)="imagenSiguiente()">
          ›
        </button>
      </div>

      <div class="thumbs" *ngIf="planta.imagenes.length > 1">
        <button
          *ngFor="let img of planta.imagenes; trackBy: trackByIndex"
          class="thumb"
          [class.active]="imagenActiva === '/' + img"
          (click)="cambiarImagen(img)">
          <img [src]="'/' + img" />
        </button>
      </div>

    </div>

    <!-- ===== INFO ===== -->
    <div class="detalle-info">
      <h1>{{ planta.nombre }}</h1>

      <p class="precio">
        {{ planta.precio | number:'1.0-0':'es' }} Gs
      </p>

      <p class="descripcion">
        {{ planta.descripcion }}
      </p>

      <a
        class="cta"
        target="_blank"
        [href]="'https://wa.me/595991611061?text=Hola, me interesa la planta ' + planta.nombre">
        Solicitar cotización
      </a>
    </div>

  </div>

  <div class="detalle-loading" *ngIf="cargando">
    Cargando producto…
  </div>

</section>
