<!-- HEADER -->
<header class="header">
  <div class="container header-inner">
    <a class="logo" routerLink="/" fragment="top">VIVERO</a>
  </div>
</header>

<!-- PAGE -->
<section class="detalle-page">
  <!-- BREADCRUMB -->
  <nav class="breadcrumb" *ngIf="planta">
    <a routerLink="/">Cat&aacute;logo</a>
    <span>/</span>
    <strong>{{ planta.nombre }}</strong>
  </nav>

  <!-- CONTENIDO -->
  <div class="detalle-grid" *ngIf="!cargando && planta">
    <!-- GALERIA -->
    <div class="galeria-card">
      <div class="galeria">
        <div class="imagen-wrap">
          <button
            class="nav-arrow left"
            *ngIf="planta.imagenes.length > 1"
            (click)="imagenAnterior()">
            &#8249;
          </button>

          <img
            class="imagen-principal"
            [src]="imagenActiva"
            [alt]="planta.nombre" />

          <button
            class="nav-arrow right"
            *ngIf="planta.imagenes.length > 1"
            (click)="imagenSiguiente()">
            &#8250;
          </button>
        </div>

        <div class="thumbs" *ngIf="planta.imagenes.length > 1">
          <button
            *ngFor="let img of planta.imagenes; trackBy: trackByIndex"
            class="thumb"
            [class.active]="imagenActiva === '/' + img"
            (click)="cambiarImagen(img)">
            <img [src]="'/' + img" [alt]="planta.nombre" />
          </button>
        </div>
      </div>
    </div>

    <!-- INFO -->
    <div class="detalle-info">
      <p class="detalle-kicker">Selecci&oacute;n del vivero</p>
      <h1>{{ planta.nombre }}</h1>

      <p class="precio">
        {{ planta.precio | number:'1.0-0':'es' }} Gs
      </p>

      <p class="descripcion">
        {{ planta.descripcion }}
      </p>

      <div class="detalle-notes">
        <span>Presentaci&oacute;n inspirada en tonos tierra y oliva</span>
        <span>Ideal para consultas r&aacute;pidas por WhatsApp</span>
      </div>

      <a
        class="cta"
        target="_blank"
        [href]="'https://wa.me/595991611061?text=Hola, me interesa la planta ' + planta.nombre">
        Solicitar cotizaci&oacute;n
      </a>
    </div>
  </div>

  <div class="detalle-loading" *ngIf="cargando">
    Cargando producto...
  </div>
</section>
