

<!-- HEADER -->
<header class="header">
  <div class="container header-inner">
    <a class="logo" routerLink="/">VIVERO</a>
  </div>
</header>


<section class="filters">
  <button
    *ngFor="let c of categorias"
    [class.active]="c.value === categoriaSeleccionada"
    (click)="seleccionarCategoria(c.value)">
    {{ c.label }}
  </button>

  <div class="actions">
    <select #ordenSelect (change)="ordenar(ordenSelect.value)">
      <option value="precio-asc">Precio más bajo primero</option>
      <option value="precio-desc">Precio más alto primero</option>
    </select>
  </div>
</section>




<section class="catalogo">
  <div class="grid loaded">

    <ng-container *ngIf="!cargando">

        <article
          class="card"
          *ngFor="let planta of plantasFiltradas"
          [routerLink]="['/plantas', planta.id]"
          [queryParams]="categoriaSeleccionada !== 'ALL'
            ? { categoria: categoriaSeleccionada }
            : {}"
>

        <div class="image-wrapper">
          <img
            [src]="planta.imagenPrincipal"
            alt="{{ planta.nombre }}"
            loading="lazy"
          />
        </div>

        <div class="info">
          <h3>{{ planta.nombre }}</h3>
          <span class="precio">
            {{ planta.precio | number:'1.0-0':'es' }} Gs
          </span>
        </div>
      </article>

    </ng-container>

  </div>
</section>
