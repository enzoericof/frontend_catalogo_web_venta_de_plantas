

<header class="header">
  <div class="container header-inner">
    <h1 class="logo">VIVERO</h1>
  </div>
</header>


<section class="filters">
  <button
    *ngFor="let c of categorias"
    [class.active]="c.value === categoriaSeleccionada"
    (click)="seleccionarCategoria(c.value)">
    {{ c.label }}
  </button>

  <div class="actions">
      <select #ordenSelect (change)="ordenar(ordenSelect.value)">
        <option value="precio-asc">Precio ↑</option>
        <option value="precio-desc">Precio ↓</option>
      </select>
    </div>
</section>



<section class="catalogo">
  <div class="grid loaded">

    <ng-container *ngIf="!cargando">

        <article
          class="card"
          *ngFor="let planta of plantasFiltradas; let i = index; trackBy: trackByPlanta"
          [routerLink]="['/plantas', planta.id]"
          [style.animationDelay]="(i * 60) + 'ms'"
        >


        <div class="image-wrapper">
          <img
            [src]="planta.imagenPrincipal"
            alt="{{ planta.nombre }}"
            loading="lazy"
          />
        </div>

        <div class="info">
          <h3>{{ planta.nombre }}</h3>
          <span class="precio">
            {{ planta.precio | number:'1.0-0':'es' }} Gs
          </span>
        </div>
      </article>

    </ng-container>

  </div>
</section>
