<section class="catalogue" aria-labelledby="titulo-catalogo">
  <header>
    <h1 id="titulo-catalogo">Catálogo.</h1>
    <p>Todos nuestros productos.</p>
  </header>
  <div class="product-grid">
    @for (p of productos; track p.id) {
      <a class="product-card" [routerLink]="['/plantas', p.id]">
        <img [src]="p.fotos[0].archivo" [alt]="p.fotos[0].descripcion" width="1200" height="1600" />
        <div class="card-copy">
          <h2>{{ p.nombre }}</h2>
          <p class="botanical">{{ p.nombreBotanico }}</p>
          <p>{{ p.descripcion }}</p>
          <span>Ver producto</span>
        </div>
      </a>
    }
  </div>
</section>
